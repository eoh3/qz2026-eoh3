<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文章列表</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; background-color: #f44336; color: white; text-decoration: none; border-radius: 3px; }
        .download-btn { background-color: #4CAF50; }
    </style>
</head>
<body>
    <h1>文章管理系统</h1>
    <h2>文章列表</h2>
    <table>
        <tr>
            <th>标题</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
        {% for article in articles %}
        <tr>
            <td>{{ article.title }}</td>
            <td>{{ article.created_at }}</td>
            <td>
                <!-- 软删除按钮 -->
                <a href=" 'article_soft_delete' article.pk %}" class="btn" onclick="return confirm('确定要删除此文章吗？')">删除</a >
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">暂无文章</td>
        </tr>
        {% endfor %}
    </table>

    <h2>最近操作审计日志</h2>
    <table>
        <tr>
            <th>操作动作</th>
            <th>时间</th>
        </tr>
        {% for log in logs %}
        <tr>
            <td>{{ log.action }}</td>
            <td>{{ log.timestamp }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
